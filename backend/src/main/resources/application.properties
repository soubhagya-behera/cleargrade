# ClearGrade — shared non-secret defaults. Deployment-specific values are
# supplied through environment variables and the external local profile
# (backend/config/application-local.properties, D-20). No real credentials
# are stored in this file.

# Application identity
spring.application.name=cleargrade

# Server
server.port=${APP_PORT:8080}

# Database (env-driven; overridden by the external local profile when the
# local profile is active). DB name/user come from Compose for non-local runs.
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:cleargrade}
spring.datasource.username=${POSTGRES_USER:cleargrade_app}
spring.datasource.password=${POSTGRES_PASSWORD:}

# Schema: validate only; Flyway performs schema management.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Database
spring.flyway.enabled=true

# Upload limits (U-06): the servlet limits are derived from the application
# property so a single setting enforces both Spring multipart handling and the
# controller-side guard.
cleargrade.upload.max-file-size=${CLEARGRADE_UPLOAD_MAX_FILE_SIZE:10485760}
spring.servlet.multipart.max-file-size=${cleargrade.upload.max-file-size:10485760}
spring.servlet.multipart.max-request-size=${cleargrade.upload.max-file-size:10485760}

# ClearGrade Intelligence (optional; no key is required for imports or rule-based analysis).
# The API key is never logged, exposed by an endpoint or sent to the browser.
cleargrade.ai.enabled=${CLEARGRADE_AI_ENABLED:true}
cleargrade.ai.deterministic-enabled=${CLEARGRADE_AI_DETERMINISTIC_ENABLED:true}
cleargrade.ai.gemini.api-key=${GEMINI_API_KEY:}
cleargrade.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
cleargrade.ai.gemini.endpoint=${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/interactions}
cleargrade.ai.gemini.timeout-connect-ms=10000
cleargrade.ai.gemini.timeout-read-ms=${GEMINI_TIMEOUT_READ_MS:60000}
cleargrade.ai.ollama.base-url=${OLLAMA_BASE_URL:}
cleargrade.ai.ollama.model=${OLLAMA_MODEL:}
cleargrade.ai.ollama.timeout-connect-ms=5000
cleargrade.ai.ollama.timeout-read-ms=${OLLAMA_TIMEOUT_READ_MS:60000}
cleargrade.ai.cache.ttl-seconds=600
cleargrade.ai.cache.max-entries=64
cleargrade.ai.max-prompt-chars=8000
cleargrade.ai.max-response-chars=16000
cleargrade.ai.cooldown-seconds=${CLEARGRADE_AI_COOLDOWN_SECONDS:0}

# Health (SECURITY.md §3)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
