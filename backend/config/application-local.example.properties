# Template for backend/config/application-local.properties (PRIVATE, git-ignored, D-20).
# Copy to application-local.properties and replace placeholders with LOCAL-ONLY values.
# This committed example contains placeholders only — never real credentials.
# Activate with SPRING_PROFILES_ACTIVE=local when running from the backend directory.
spring.datasource.url=jdbc:postgresql://localhost:5432/cleargrade
spring.datasource.username=CHANGE_ME_LOCALLY
spring.datasource.password=CHANGE_ME_LOCALLY

# Optional ClearGrade Intelligence (never put a real key in this committed example).
cleargrade.ai.enabled=true
cleargrade.ai.gemini.api-key=${GEMINI_API_KEY:}
cleargrade.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
cleargrade.ai.gemini.timeout-connect-ms=10000
cleargrade.ai.gemini.timeout-read-ms=${GEMINI_TIMEOUT_READ_MS:60000}
cleargrade.ai.ollama.base-url=${OLLAMA_BASE_URL:}
cleargrade.ai.ollama.model=${OLLAMA_MODEL:}
cleargrade.ai.ollama.timeout-connect-ms=5000
cleargrade.ai.ollama.timeout-read-ms=${OLLAMA_TIMEOUT_READ_MS:60000}
cleargrade.ai.cache.ttl-seconds=600
cleargrade.ai.cache.max-entries=64
cleargrade.ai.cooldown-seconds=${CLEARGRADE_AI_COOLDOWN_SECONDS:0}
